name: Feature request
description: Suggest something the launcher should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is awkward or impossible today?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: dropdown
    id: os
    attributes:
      label: Platforms this affects
      multiple: true
      options: [Windows, Linux, macOS, All]
