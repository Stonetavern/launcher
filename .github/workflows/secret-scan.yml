# Credential- und Topologie-Waechter.
#
# Ergaenzt GitHub Push Protection (die auf oeffentlichen Repos automatisch
# laeuft), ersetzt sie nicht: Push Protection kennt Anbieter-Muster, aber nicht
# unsere eigene Topologie. Dass eine bestimmte Adresse der Account-Hub ist,
# weiss nur unser eigenes Regelwerk.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Woechentlich ueber die GESAMTE Historie: Regeln verrotten still, und ein
    # Geheimnis, das gestern unbekannt war, kann heute erkannt werden.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    # Auf dem UNTRUSTED-Build-Runner: der Scanner braucht kein Secret, und ein
    # Scanner mit Deploy-Rechten waere selbst ein Angriffsziel.
    # Hosted: dieser Job braucht kein Secret und keinen Netzzugang nach innen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}
          persist-credentials: false

      # Binary direkt statt gitleaks-action: die Action verlangt fuer
      # ORGANISATIONEN eine Lizenz, und ein gepinntes Binary mit geprueftem
      # Hash ist ohnehin die ehrlichere Lieferkette.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -o gl.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o gl.sums   "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Ohne diese Zeile waere der Download nur "hat funktioniert",
          # nicht "ist das, was der Herausgeber veroeffentlicht hat".
          grep "linux_x64.tar.gz" gl.sums | sed "s|gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz|gl.tar.gz|" | sha256sum -c -
          tar xzf gl.tar.gz gitleaks
          # Auf einem Runner gibt es keinen Staging-Bereich. Die fruehere Fassung
          # rief bei push/PR "git --pre-commit --staged" auf und scannte damit
          # gemessene 0 Bytes — der Job war gruen, ohne je eine Datei gelesen zu
          # haben. "dir" scannt den ausgecheckten Arbeitsbaum (gemessen: 2,65 MB).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ./gitleaks git --redact --no-banner -v .     # volle Historie (fetch-depth 0)
          else
            ./gitleaks dir --redact --no-banner -v .     # der Stand, der gepusht wurde
          fi

      # Pfad-Waechter: gitleaks liest komprimierte Dateien NICHT (gemessen:
      # eine .sql.zst ergibt "scanned ~0 bytes — no leaks found"). Der Dateiname
      # allein genuegt hier als Beweis.
      - name: Verbotene Pfade
        run: |
          BAD=$(git log --pretty=format: --name-only --all | sort -u | grep -nE \
            '\.(sql|dump)(\.(gz|zst|xz|bz2))?$|(^|/)(id_rsa|id_ed25519)$|\.(pem|pfx|p12)$|(^|/)\.env$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Verbotene Pfade in der Historie:"; echo "$BAD"; exit 1
          fi
          echo "Keine verbotenen Pfade."

      # 🔴 Die Regel ist nicht "keine gehosteten Runner", sondern:
      #    Deploy-Jobs duerfen NIE gehostet laufen. Ein gehosteter Runner mit
      #    Deploy-Rechten waere ein Weg von aussen ins interne Netz.
      #    Bauen auf gehosteten Runnern ist auf einem OEFFENTLICHEN Repo
      #    dagegen die sicherere Wahl: fremder PR-Code laeuft dann auf einer
      #    Wegwerf-VM statt auf eigener Hardware.
      # Prueft JOB-Definitionen, nicht Textzeilen. Die erste Fassung war ein
      # grep ueber '.*deploy.*:' und traf damit ihren eigenen Schritt-Namen —
      # der Waechter meldete sich selbst als Verstoss (2026-07-26).
      - name: Deploy-Jobs muessen self-hosted sein
        run: |
          python3 - <<'CHECK'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              wf = yaml.safe_load(open(f)) or {}
              for job_id, job in (wf.get('jobs') or {}).items():
                  label = f"{job_id} {job.get('name','')}".lower()
                  if 'deploy' not in label and 'release' not in label:
                      continue
                  runs = job.get('runs-on')
                  flat = ' '.join(runs) if isinstance(runs, list) else str(runs)
                  if any(h in flat for h in ('ubuntu-', 'windows-', 'macos-')):
                      bad.append(f"{f}: job '{job_id}' auf gehostetem Runner ({flat})")
          for b in bad:
              print(f"::error::{b}")
          if bad:
              sys.exit(1)
          print("Kein Deploy-/Release-Job auf einem gehosteten Runner.")
          CHECK
